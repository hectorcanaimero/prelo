[project]
name = "prelo"
version = "0.1.0"
description = "Mesa editorial de agentes: una idea → blog (es/pt/en), LinkedIn e Instagram, con aprobación humana."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2",
    "langchain>=1.0",
    "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prelo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
