[project]
name = "prelo"
version = "0.1.0"
description = "Mesa editorial de agentes: una idea → blog (es/pt/en), LinkedIn e Instagram, con aprobación humana."
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "fastapi",
    "httpx",
    "langfuse",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "psycopg[binary,pool]",
    "pydantic-settings",
    "slack-bolt",
    "tavily-python",
    "uvicorn",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "respx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prelo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
