# Reglas de marca de Prelo (src/prelo/revisao.py).
# "bloqueia": impide aprobar sin editar. "aviso": solo se muestra.
# Los nombres reales de empleadores y clientes van en marca.local.toml (fuera de git),
# con la misma estructura; las listas se suman.

[bloqueia]
# Empleadores y clientes: nunca en un texto público.
empregadores = ["EmpresaExemplo"]

[aviso]
# Frases que delatan texto escrito por IA.
cara_de_ia = [
  "no mundo atual", "no cenário atual", "vale ressaltar", "é importante destacar", "em resumo",
  "mergulhar", "desbloquear", "potencializar", "divisor de águas",
  "en el mundo actual", "cabe destacar", "sumergirnos", "en resumen",
  "in today's world", "delve", "unlock", "game-changer", "game changer",
]
# Raya larga: no se usa.
caracteres = ["—"]
