name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prelo
          POSTGRES_PASSWORD: prelo
          POSTGRES_DB: prelo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prelo -d prelo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://prelo:prelo@localhost:5432/prelo_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
