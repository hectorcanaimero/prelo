display_information:
  name: Prelo
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true # para hablarle por mensaje directo
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Prelo
    always_online: true
  slash_commands:
    - command: /prelo
      description: Inicia un post a partir de un tema
      usage_hint: "<tema>"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - channels:history # leer menciones y respuestas en hilos del canal (público)
      - groups:history # lo mismo si el canal es privado
      - im:history # mensajes directos
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
